{% for error in form.non_field_errors %}<p class="alert" role="alert">{{ error }}</p>{% endfor %}
{% for field in form.visible_fields %}
<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<small class="muted">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
</div>
{% endfor %}
